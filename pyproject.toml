[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "renulus"
version = "0.1.0"
description = "Local Windows nephrology learning application"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
renulus = "renulus.server:main"

[tool.hatch.build.targets.wheel]
packages = ["runtime/renulus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["runtime"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
